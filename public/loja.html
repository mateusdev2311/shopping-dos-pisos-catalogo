<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b2d2f">
  <title>Shopping dos Pisos — Catálogo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/loja.css?v=5">
</head>
<body>
  <!-- A faixa da marca rola junto com a página; busca, carrinho e categorias ficam presos no topo. -->
  <header class="marca-faixa">
    <div class="marca">
      <span class="marca-icone" aria-hidden="true"></span>
      <div>
        <strong>Shopping dos Pisos</strong>
        <small id="saudacao">Catálogo exclusivo</small>
      </div>
    </div>
  </header>
  <div class="topo">
    <div class="topo-conteudo">
      <div class="busca">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="busca" type="search" placeholder="Buscar piso, rejunte…" autocomplete="off" enterkeyhint="search">
      </div>
      <button type="button" class="botao-carrinho" id="abrir-carrinho" aria-label="Abrir carrinho">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 3.5h2.3l2.5 11a1 1 0 0 0 1 .8h9a1 1 0 0 0 1-.8l1.6-7.3H6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9.5" cy="19.5" r="1.6" fill="currentColor"/><circle cx="17" cy="19.5" r="1.6" fill="currentColor"/></svg>
        <span class="contador" id="contador" hidden>0</span>
      </button>
    </div>
    <nav class="categorias" id="categorias" aria-label="Categorias"></nav>
  </div>

  <main id="vitrine">
    <section class="destaque" id="destaque">
      <div>
        <p class="destaque-rotulo">Atendimento pelo WhatsApp</p>
        <h1>Monte seu pedido com calma.</h1>
        <p>Escolha os produtos, ajuste as quantidades e finalize. Um atendente confirma tudo com você na conversa.</p>
      </div>
    </section>
    <p class="resultado" id="resultado"></p>
    <div class="grade" id="grade"></div>
  </main>

  <div class="barra-carrinho" id="barra-carrinho" hidden>
    <div>
      <small id="barra-itens"></small>
      <strong id="barra-total"></strong>
    </div>
    <button type="button" class="botao primario" id="barra-ver">Ver carrinho</button>
  </div>

  <!-- Detalhe do produto -->
  <div class="painel" id="painel-produto" hidden>
    <div class="painel-fundo" data-fechar></div>
    <section class="painel-folha" role="dialog" aria-modal="true" aria-labelledby="produto-nome">
      <button type="button" class="fechar" data-fechar aria-label="Fechar">×</button>
      <div id="produto-conteudo"></div>
    </section>
  </div>

  <!-- Carrinho e finalização -->
  <div class="painel" id="painel-carrinho" hidden>
    <div class="painel-fundo" data-fechar></div>
    <section class="painel-folha lateral" role="dialog" aria-modal="true" aria-labelledby="carrinho-titulo">
      <button type="button" class="fechar" data-fechar aria-label="Fechar">×</button>
      <div id="carrinho-conteudo"></div>
    </section>
  </div>

  <div class="aviso-flutuante" id="aviso" role="status" aria-live="polite" hidden></div>

  <template id="tpl-erro-link">
    <div class="tela-cheia">
      <h1>Link indisponível</h1>
      <p id="erro-link-texto"></p>
    </div>
  </template>

  <script src="/static/loja.js?v=5"></script>
</body>
</html>
